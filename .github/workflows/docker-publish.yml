name: build-and-push-image

# MCP 이미지를 linux/amd64로 빌드해 GitHub Container Registry(ghcr.io)에 푸시.
# PlayMCP in KC는 arm64를 거부하므로 platforms를 linux/amd64로 고정한다.

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64          # ★ arm64 금지
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/stock-quiz-mcp:latest
