[project]
name = "stock-quiz-mcp"
version = "0.1.0"
description = "Stock Quiz Dictionary(주식사전 퀴즈) MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",  # Linux: uvloop+httptools로 처리량 향상
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["contracts", "clients", "services", "store", "batch", "server"]
